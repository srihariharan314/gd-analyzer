<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | GD Analyzer</title>
    <link rel="stylesheet" href="../css/glass-lagoon.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Floating Navigation Bar -->
    <nav class="lagoon-nav">
        <div class="lagoon-nav-inner">
            <a href="../index.html" class="lagoon-logo">
                <div class="lagoon-logo-icon"><i class="fas fa-comments"></i></div>
                <span>GD<span class="text-gradient-vibrant">Analyzer</span></span>
            </a>
            <div class="lagoon-nav-links">
                <a href="../index.html" class="lagoon-nav-link">Home</a>
                <a href="prepare.html" class="lagoon-nav-link">Topics</a>
                <a href="rooms.html" class="lagoon-nav-link">Human Rooms</a>
            </div>
            <div class="lagoon-nav-actions">
                <a href="login.html" class="btn-lagoon btn-lagoon-outline" style="padding: 0.45rem 1.1rem; font-size: 0.88rem;">Log In</a>
            </div>
        </div>
    </nav>

    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 6.5rem 1.5rem 3rem 1.5rem;">
        <div class="glass-card" style="width: 100%; max-width: 460px; padding: 2.5rem; position: relative;">
            
            <div style="text-align: center; margin-bottom: 2rem;">
                <div class="lagoon-logo-icon" style="margin: 0 auto 1rem auto; width: 44px; height: 44px; font-size: 1.3rem;">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Create Your Account</h2>
                <p style="color: var(--text-secondary); font-size: 0.9rem;">Join thousands of students and job seekers practicing GDs</p>
            </div>

            <!-- Error Banner -->
            <div id="signupError" style="display: none; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: var(--lagoon-rose); padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 1.25rem;"></div>

            <!-- Google Sign In -->
            <button type="button" class="btn-lagoon btn-lagoon-secondary btn-google-auth" style="width: 100%; margin-bottom: 1.25rem; font-size: 0.92rem;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width: 18px;" alt="Google">
                <span>Sign Up with Google</span>
            </button>

            <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem;">
                <div style="flex: 1; height: 1px; background: rgba(255, 255, 255, 0.08);"></div>
                <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">or details</span>
                <div style="flex: 1; height: 1px; background: rgba(255, 255, 255, 0.08);"></div>
            </div>

            <form id="signupForm">
                <div class="lagoon-input-group">
                    <label class="lagoon-input-label" for="name">Full Name</label>
                    <input type="text" id="name" class="lagoon-input" required placeholder="Candidate Alex" autocomplete="name">
                </div>

                <div class="lagoon-input-group">
                    <label class="lagoon-input-label" for="email">Email Address</label>
                    <input type="email" id="email" class="lagoon-input" required placeholder="alex@domain.com" autocomplete="email">
                </div>

                <div class="lagoon-input-group">
                    <label class="lagoon-input-label" for="password">Password</label>
                    <input type="password" id="password" class="lagoon-input" required placeholder="At least 6 characters" autocomplete="new-password">
                </div>

                <div class="lagoon-input-group">
                    <label class="lagoon-input-label" for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="lagoon-input" required placeholder="Re-enter password" autocomplete="new-password">
                </div>

                <button type="submit" class="btn-lagoon btn-lagoon-primary" style="width: 100%; margin-top: 0.5rem;">
                    <span>Create Free Account</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 1.5rem;">
                Already have an account? <a href="login.html" style="font-weight: 600;">Sign In</a>
            </p>

        </div>
    </div>

    <script type="module" src="../js/auth.js"></script>
</body>
</html>
