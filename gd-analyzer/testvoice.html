<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice System Diagnostic</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .test-container {
            max-width: 600px;
            margin: 4rem auto;
            padding: 3rem 2.5rem;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            box-shadow: var(--shadow-lg), 0 0 0 1px var(--glass-border);
            text-align: center;
        }
        .status-box {
            margin-top: 2.5rem;
            padding: 1.5rem;
            border-radius: 12px;
            background: #f8fafc;
            min-height: 120px;
            text-align: left;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.9rem;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            overflow-y: auto;
            max-height: 300px;
            color: var(--dark-color);
            line-height: 1.8;
        }
        .pulse-ring {
            display: inline-flex;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 2rem;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
        }
        .pulse-ring.active {
            animation: pulse-ring-anim 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(135deg, var(--success-color), #059669);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        @keyframes pulse-ring-anim {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="pulse-ring" id="micIcon">🎤</div>
        <h1 style="margin-bottom: 0.5rem; color: var(--dark-color); font-weight: 700;">Voice Diagnostic</h1>
        <p style="color: var(--gray-color); margin-bottom: 2.5rem; font-size: 1.1rem;">Test your microphone and text-to-speech capabilities.</p>
        
        <button id="testBtn" class="btn btn-primary" style="font-size: 1.1rem; padding: 1rem 2.5rem; border-radius: 50px;">
            Initialize Voice Test
        </button>
        
        <div id="status" class="status-box">
            System ready. Click the button above to begin diagnostic.
        </div>
    </div>

    <script src="js/voicemanager.js"></script>
    <script>
        document.getElementById('testBtn').addEventListener('click', () => {
            const status = document.getElementById('status');
            const micIcon = document.getElementById('micIcon');
            const btn = document.getElementById('testBtn');

            if (window.voiceManager) {
                status.innerHTML = '<span style="color: var(--warning-color);">⚙️ Initializing VoiceManager...</span>';
                btn.disabled = true;
                btn.textContent = 'Testing in progress...';
                btn.style.opacity = '0.7';

                const started = window.voiceManager.startListening((speech) => {
                    if (speech.final) {
                        status.innerHTML += `<br><span style="color: var(--primary-color); font-weight: 600;">🗣️ You said:</span> ${speech.final}`;
                        micIcon.classList.remove('active');
                        status.scrollTop = status.scrollHeight;
                    }
                });

                if (started) {
                    status.innerHTML += '<br><span style="color: var(--success-color); font-weight: 600;">✅ Listening active. Please speak now...</span>';
                    micIcon.classList.add('active');
                    status.scrollTop = status.scrollHeight;

                    // Test speaking after 5 seconds
                    setTimeout(() => {
                        status.innerHTML += '<br><br><span style="color: var(--accent-color); font-weight: 600;">🤖 AI Voice response initiated...</span>';
                        status.scrollTop = status.scrollHeight;
                        micIcon.classList.remove('active');
                        window.voiceManager.speak("Hello, I'm the AI assistant. Your voice system is working perfectly.");
                        btn.disabled = false;
                        btn.textContent = 'Run Test Again';
                        btn.style.opacity = '1';
                    }, 5000);
                }
            } else {
                status.innerHTML = '<br><span style="color: var(--danger-color); font-weight: 600;">❌ CRITICAL ERROR: VoiceManager not loaded.</span>';
            }
        });
    </script>
</body>
</html>
